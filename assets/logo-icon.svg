<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <!-- 3 Overlapping Brand Circles with Blend Effect -->
  <g style="isolation: isolate;">
    <circle cx="76" cy="74" r="50" fill="#0B2545" style="mix-blend-mode: multiply; opacity: 0.92;" />
    <circle cx="124" cy="74" r="50" fill="#13A89E" style="mix-blend-mode: multiply; opacity: 0.88;" />
    <circle cx="100" cy="122" r="50" fill="#7DD3D0" style="mix-blend-mode: multiply; opacity: 0.92;" />
  </g>
</svg>
