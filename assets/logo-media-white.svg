<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 190" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&amp;display=swap');
      .logo-media-white-title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: -1.5px;
      }
      .logo-media-white-sub {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        fill: #FBBF24;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
    </style>
  </defs>
  
  <!-- 3 Overlapping Brand Circles for Dark Background -->
  <g style="isolation: isolate;">
    <circle cx="84" cy="76" r="54" fill="#F59E0B" style="mix-blend-mode: screen; opacity: 0.85;" />
    <circle cx="152" cy="76" r="54" fill="#FDE68A" style="mix-blend-mode: screen; opacity: 0.85;" />
    <circle cx="118" cy="130" r="54" fill="#D97706" style="mix-blend-mode: screen; opacity: 0.9;" />
  </g>

  <!-- Wordmark -->
  <text class="logo-media-white-title" x="228" y="106" font-size="84">Ezion</text>
  <text class="logo-media-white-sub" x="232" y="152" font-size="34">Media</text>
</svg>
