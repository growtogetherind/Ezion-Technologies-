<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 190" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&amp;display=swap');
      .logo-brand-title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        fill: #0B2545;
        letter-spacing: -1.5px;
      }
      .logo-brand-sub {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        fill: #13A89E;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>
  
  <!-- 3 Overlapping Brand Circles with Multiply & Alpha Blend -->
  <g style="isolation: isolate;">
    <!-- Top Left: Deep Navy -->
    <circle cx="84" cy="76" r="54" fill="#0B2545" fill-opacity="0.92" style="mix-blend-mode: multiply;" />
    <!-- Top Right: Primary Teal -->
    <circle cx="152" cy="76" r="54" fill="#13A89E" fill-opacity="0.88" style="mix-blend-mode: multiply;" />
    <!-- Bottom Center: Light Teal -->
    <circle cx="118" cy="130" r="54" fill="#7DD3D0" fill-opacity="0.90" style="mix-blend-mode: multiply;" />
  </g>

  <!-- Wordmark -->
  <text class="logo-brand-title" x="228" y="106" font-size="84">Ezion</text>
  <text class="logo-brand-sub" x="230" y="154" font-size="36">Technologies</text>
</svg>
