<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&amp;display=swap');
      .logo-brand-white-title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: -1.5px;
      }
      .logo-brand-white-sub {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        fill: #7DD3D0;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>
  
  <!-- 3 Overlapping Brand Circles for Dark Background -->
  <g style="isolation: isolate;">
    <!-- Top Left: Light / Ice Blue-Navy -->
    <circle cx="82" cy="74" r="54" fill="#38BDF8" style="mix-blend-mode: screen; opacity: 0.85;" />
    <!-- Top Right: Primary Vibrant Teal -->
    <circle cx="150" cy="74" r="54" fill="#14F1D9" style="mix-blend-mode: screen; opacity: 0.85;" />
    <!-- Bottom Center: Light Teal -->
    <circle cx="116" cy="128" r="54" fill="#7DD3D0" style="mix-blend-mode: screen; opacity: 0.9;" />
  </g>

  <!-- Wordmark -->
  <text class="logo-brand-white-title" x="228" y="102" font-size="82">Ezion</text>
  <text class="logo-brand-white-sub" x="231" y="152" font-size="36">Technologies</text>
</svg>
