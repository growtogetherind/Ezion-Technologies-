<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 190" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&amp;display=swap');
      .logo-media-title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        fill: #0B2545;
        letter-spacing: -1.5px;
      }
      .logo-media-sub {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        fill: #D97706;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
    </style>
  </defs>
  
  <!-- 3 Overlapping Brand Circles with Amber Media Palette -->
  <g style="isolation: isolate;">
    <!-- Top Left: Deep Navy -->
    <circle cx="84" cy="76" r="54" fill="#0B2545" fill-opacity="0.92" style="mix-blend-mode: multiply;" />
    <!-- Top Right: Radiant Amber -->
    <circle cx="152" cy="76" r="54" fill="#F59E0B" fill-opacity="0.90" style="mix-blend-mode: multiply;" />
    <!-- Bottom Center: Warm Gold -->
    <circle cx="118" cy="130" r="54" fill="#FBBF24" fill-opacity="0.92" style="mix-blend-mode: multiply;" />
  </g>

  <!-- Wordmark -->
  <text class="logo-media-title" x="228" y="106" font-size="84">Ezion</text>
  <text class="logo-media-sub" x="232" y="152" font-size="34">Media</text>
</svg>
